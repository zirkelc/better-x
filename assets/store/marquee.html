<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        width: 1400px;
        height: 560px;
        box-sizing: border-box;
        padding: 0 96px;
        display: flex;
        align-items: center;
        gap: 72px;
        background: linear-gradient(160deg, #0f1419 0%, #15202b 100%);
        color: #e7e9ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        flex: none;
        width: 168px;
        height: 168px;
        border-radius: 38px;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .name {
        font-size: 66px;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      .tag {
        margin-top: 16px;
        font-size: 24px;
        color: #8b98a5;
        max-width: 780px;
        line-height: 1.4;
      }
      ul {
        margin: 30px 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        max-width: 860px;
      }
      li {
        font-size: 16px;
        color: #c9d1d9;
        border: 1px solid rgba(231, 233, 234, 0.16);
        border-radius: 999px;
        padding: 7px 15px;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="102" height="102" viewBox="0 0 128 128" fill="none">
        <g stroke-linecap="round" stroke-width="18">
          <line x1="36" y1="36" x2="92" y2="92" stroke="#ffffff" />
          <line x1="92" y1="36" x2="36" y2="92" stroke="#1d9bf0" />
        </g>
      </svg>
    </div>
    <div>
      <div class="name">Better X</div>
      <div class="tag">
        Four small upgrades to the x.com composer and timeline. No account, no tracking, no data
        collection.
      </div>
      <ul>
        <li>Character counter</li>
        <li>Word &amp; selection tooltips</li>
        <li>Code formatter</li>
        <li>Open post in new tab</li>
      </ul>
    </div>
  </body>
</html>
