<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        width: 440px;
        height: 280px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #0f1419 0%, #15202b 100%);
        color: #e7e9ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        width: 76px;
        height: 76px;
        border-radius: 17px;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .name {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .tag {
        font-size: 14px;
        color: #8b98a5;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="46" height="46" viewBox="0 0 128 128" fill="none">
        <g stroke-linecap="round" stroke-width="18">
          <line x1="36" y1="36" x2="92" y2="92" stroke="#ffffff" />
          <line x1="92" y1="36" x2="36" y2="92" stroke="#1d9bf0" />
        </g>
      </svg>
    </div>
    <div class="name">Better X</div>
    <div class="tag">Small but useful upgrades for x.com</div>
  </body>
</html>
